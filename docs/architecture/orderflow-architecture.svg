<svg viewBox="0 0 1000 1400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-description" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="architecture-title">OrderFlow — Order Processing and Cancellation</title>
  <desc id="architecture-description">One Spring Boot application saves orders and outbox events in PostgreSQL. Kafka delivers events at least once. Processing locks the order, ignores terminal orders, then locks the product. Cancellation shares the order lock. Retryable failures return to Kafka. Redis caches product reads for two or five minutes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7681" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1400" fill="#0d1117" />

  <text x="500" y="44" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="700">OrderFlow — Runtime Architecture</text>
  <text x="500" y="68" text-anchor="middle" fill="#8b949e" font-size="13">Source inspection: one Spring Boot application, PostgreSQL, Kafka and Redis</text>

  <!-- connecting lines (drawn first, under boxes) -->
  <g stroke="#6e7681" stroke-width="1.8" fill="none">
    <line x1="380" y1="162" x2="380" y2="216" marker-end="url(#arrow)" />
    <line x1="380" y1="290" x2="380" y2="354" marker-end="url(#arrow)" />
    <line x1="380" y1="428" x2="380" y2="482" marker-end="url(#arrow)" />
    <line x1="380" y1="556" x2="380" y2="610" marker-end="url(#arrow)" />
    <line x1="380" y1="684" x2="380" y2="738" marker-end="url(#arrow)" />
    <line x1="380" y1="812" x2="380" y2="866" marker-end="url(#arrow)" />
    <line x1="380" y1="940" x2="380" y2="1004" marker-end="url(#arrow)" />
    <line x1="380" y1="1078" x2="380" y2="1132" marker-end="url(#arrow)" />
    <!-- CTRL -> REDIS -->
    <line x1="620" y1="254" x2="696" y2="254" marker-end="url(#arrow)" />
  </g>
  <!-- dashed feedback: InventoryService evicts Redis cache on confirm -->
  <polyline points="620,904 860,904 860,290" fill="none" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5,5" marker-end="url(#arrow)" />
  <!-- cancellation shares the order lock and bypasses inventory changes -->
  <polyline points="620,276 670,276 670,360 700,360" fill="none" stroke="#d2a8ff" stroke-width="1.6" marker-end="url(#arrow)" />
  <polyline points="960,392 982,392 982,1050 620,1050" fill="none" stroke="#d2a8ff" stroke-width="1.6" marker-end="url(#arrow)" />
  <!-- retryable failure returns to the Kafka delivery path -->
  <polyline points="140,776 90,776 90,648 140,648" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="5,5" marker-end="url(#arrow)" />

  <!-- arrow labels (each positioned in the gap between the two boxes it connects) -->
  <g fill="#8b949e" font-size="12.5" text-anchor="middle">
    <text x="470" y="193">HTTP / REST</text>
    <text x="658" y="248">cache</text>
    <text x="530" y="316">save Order + Outbox row</text>
    <text x="530" y="331">(same transaction)</text>
    <text x="480" y="460">reads pending rows</text>
    <text x="440" y="588">publish</text>
    <text x="440" y="716">consume</text>
    <text x="420" y="844">invoke</text>
    <text x="535" y="967">stock + terminal status</text>
    <text x="535" y="982">commit together</text>
    <text x="740" y="896">evict on confirm</text>
    <text x="70" y="706" transform="rotate(-90 70 706)" fill="#58a6ff">retry every 1s</text>
    <text x="824" y="1040" fill="#d2a8ff">no stock change</text>
  </g>

  <!-- FE -->
  <rect x="140" y="90" width="480" height="72" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="380" y="121" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">React frontend</text>
  <text x="380" y="142" text-anchor="middle" fill="#8b949e" font-size="12.5">Vite build, served by nginx</text>

  <!-- CTRL -->
  <rect x="140" y="218" width="480" height="72" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="380" y="249" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Spring Boot 3</text>
  <text x="380" y="270" text-anchor="middle" fill="#8b949e" font-size="12.5">OrderController / ProductController</text>

  <!-- REDIS -->
  <rect x="700" y="218" width="260" height="72" rx="12" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="830" y="249" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="600">Redis</text>
  <text x="830" y="269" text-anchor="middle" fill="#8b949e" font-size="12">product cache</text>
  <text x="830" y="284" text-anchor="middle" fill="#8b949e" font-size="12">2 min / 5 min TTL</text>

  <!-- cancellation inside the same application -->
  <rect x="700" y="338" width="260" height="108" rx="12" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
  <text x="830" y="362" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">OrderService.cancelOrder</text>
  <text x="830" y="386" text-anchor="middle" fill="#8b949e" font-size="12">same order lock</text>
  <text x="830" y="407" text-anchor="middle" fill="#8b949e" font-size="12">PLACED → CANCELLED</text>
  <text x="830" y="428" text-anchor="middle" fill="#8b949e" font-size="12">terminal status → HTTP 409</text>
  <text x="708" y="323" fill="#d2a8ff" font-size="12">DELETE /api/orders/{id}</text>

  <!-- PG1 -->
  <rect x="140" y="356" width="480" height="72" rx="12" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="380" y="387" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">PostgreSQL</text>
  <text x="380" y="408" text-anchor="middle" fill="#8b949e" font-size="12.5">orderflow</text>

  <!-- POLLER -->
  <rect x="140" y="484" width="480" height="72" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="380" y="515" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">OutboxPoller</text>
  <text x="380" y="536" text-anchor="middle" fill="#8b949e" font-size="12.5">1s fixed delay; mark PUBLISHED after broker ack</text>

  <!-- TOPIC (pill) -->
  <rect x="140" y="612" width="480" height="72" rx="36" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="380" y="643" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Kafka topic</text>
  <text x="380" y="664" text-anchor="middle" fill="#8b949e" font-size="12.5">order-events</text>

  <!-- CONSUMER -->
  <rect x="140" y="740" width="480" height="72" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="380" y="771" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">OrderEventConsumer</text>
  <text x="380" y="792" text-anchor="middle" fill="#8b949e" font-size="12.5">propagate failures; auto-commit disabled</text>

  <!-- INV -->
  <rect x="140" y="868" width="480" height="72" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="380" y="899" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">InventoryService</text>
  <text x="380" y="920" text-anchor="middle" fill="#8b949e" font-size="12">lock order → ignore terminal → lock product</text>

  <!-- PG2 -->
  <rect x="140" y="1006" width="480" height="72" rx="12" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="380" y="1037" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">PostgreSQL</text>
  <text x="380" y="1058" text-anchor="middle" fill="#8b949e" font-size="12.5">orderflow (same database)</text>

  <!-- STATUS -->
  <rect x="140" y="1134" width="480" height="72" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="380" y="1165" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="600">Order status</text>
  <text x="380" y="1186" text-anchor="middle" fill="#8b949e" font-size="12.5">CONFIRMED / CANCELLED</text>

  <!-- captions -->
  <g fill="#8b949e" font-size="12.5">
    <text x="140" y="1246">Publisher, consumer, inventory and cancellation run in the same application.</text>
    <text x="140" y="1270">Both PostgreSQL nodes represent the same database at different stages.</text>
    <text x="140" y="1294">Publish-before-mark crashes can replay events; terminal orders ignore redelivery.</text>
    <text x="140" y="1318">Permanent retryable failures can block a partition; cache eviction is not atomic.</text>
    <text x="140" y="1342">Local runtime evidence and limitations: docs/engineering-record.md</text>
  </g>
  <text x="140" y="1372" fill="#6e7681" font-size="11.5">Source: backend/src/main/java/com/orderflow · docker-compose.yml</text>
</svg>
