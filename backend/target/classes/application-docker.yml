spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/orderflow
    username: ${POSTGRES_USER:orderflow}
    password: ${POSTGRES_PASSWORD:orderflow}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false

  kafka:
    bootstrap-servers: kafka:9092
    producer:
      retries: 5
    consumer:
      auto-offset-reset: earliest

  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms

logging:
  level:
    com.orderflow: INFO
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
    org.springframework.web: WARN
